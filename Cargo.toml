[package]
name = "lite_record"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Handheld multi-sensor mcap recorder for RealSense, Orbbec and Livox Mid-360"
repository = "https://github.com/jeff-hykin/lite_record"

[lib]
name = "lite_record"
path = "src/lib.rs"

[[bin]]
name = "lite_record"
path = "src/main.rs"

# The encode-cost bench, a real binary rather than an example, so it can be
# cross-built for the Pi like anything else: crate2nix generates derivations from
# the crate's declared targets and examples are not among them. Gated behind a
# feature so an ordinary `cargo build` does not pay for it.
#
#   cargo run --bin encode_cost --features bench
[[bin]]
name = "encode_cost"
path = "src/bin/encode_cost.rs"
required-features = ["bench"]

[features]
default = []
# Builds the encode-cost bench binary. See the [[bin]] above.
bench = []
# Every vendor SDK is opt-in so the crate builds and tests on a laptop with no
# hardware and no SDK installed.
realsense = ["dep:realsense-sys"]
livox = []
orbbec = []
oakd = ["dep:cc"]
h264 = ["dep:openh264"]
all-sensors = ["realsense", "livox", "orbbec", "oakd"]

[dependencies]
# The recode decodes a window of chunks' frames on every core (convert.rs).
rayon = "1"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
image-webp = "0.2.4"
jpeg-encoder = { version = "0.6", features = ["simd"] }
libc = "0.2"
mcap = { version = "0.25.0", default-features = false, features = ["lz4", "zstd"] }
# Converting a recording reads the whole file, and a long one is larger than the
# Pi's memory. Mapping lets the kernel page it in and drop it again.
memmap2 = "0.9"
png = "0.18.1"
# Point-LIO, run over a recording after the fact. See vendor/pointlio_rs/README.md.
pointlio_rs = { path = "vendor/pointlio_rs" }
# dimos' raycast-clearing voxel mapper, same arrangement. See vendor/voxel_ray_tracing/src/lib.rs.
voxel_ray_tracing = { path = "vendor/voxel_ray_tracing" }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "process",
    "io-util",
    "fs",
] }
# Only for `ReaderStream`, which is what lets a recording be sent without the
# Pi holding a gigabyte of it in memory first.
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
# Appending to a finished recording writes its own chunk records.
zstd = "0.13"
zune-core = "0.5.3"
zune-jpeg = "0.5"

openh264 = { version = "0.9.8", features = ["source"], optional = true }
# Deliberately not `buildtime-bindgen`: the crate ships generated bindings, and
# using them means a cross build needs only the .so and a pkg-config file rather
# than a clang that can parse the SDK's headers for the target.
realsense-sys = { version = "2.56", optional = true }
gamut-jxl-sys = "0.1"
lerc-rs = "0.5"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha2 = { version = "0.11.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }

[build-dependencies]
# Compiles the depthai shim. Optional so a build without the `oakd` feature does
# not pull a C++ toolchain in.
cc = { version = "1", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[dev-dependencies]
jxl-oxide = { version = "0.12.6", default-features = false }
re_rvl = "0.37"
