# Builds lite_record for the three platforms dtk knows how to fetch, and keeps a
# release tagged `latest` pointing at them, so
# https://github.com/jeff-hykin/lite_record/releases/latest/download/lite_record-<platform>
# is always the newest build of main.
name: release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write

jobs:
    linux-x86:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: DeterminateSystems/nix-installer-action@main
            - uses: DeterminateSystems/magic-nix-cache-action@main
            # RealSense (RSUSB, no kernel patches) + livox
            - run: nix build .#linux-x86 --print-build-logs
            - name: take the binary and the store paths it needs at runtime
              run: |
                  install -m755 result/bin/lite_record lite_record-x86_64-linux
                  ./.github/export-closure.sh result lite_record-x86_64-linux.runtime.tar.gz
            - uses: actions/upload-artifact@v4
              with:
                  name: linux-x86
                  path: lite_record-x86_64-linux*

    linux-arm64:
        # Its own job because this one cross-builds librealsense and depthai-core
        # from source, and so gets its own time budget.
        runs-on: ubuntu-latest
        timeout-minutes: 350
        steps:
            - uses: actions/checkout@v4
            - uses: DeterminateSystems/nix-installer-action@main
            - uses: DeterminateSystems/magic-nix-cache-action@main
            # every camera in one binary, so unplugging a sensor is not a rebuild
            - run: nix build .#linux-arm64 --print-build-logs
            - name: take the binary and the store paths it needs at runtime
              run: |
                  install -m755 result/bin/lite_record lite_record-aarch64-linux
                  ./.github/export-closure.sh result lite_record-aarch64-linux.runtime.tar.gz
            - uses: actions/upload-artifact@v4
              with:
                  name: linux-arm64
                  path: lite_record-aarch64-linux*

    macos:
        # apple silicon
        runs-on: macos-14
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            # nix would work here too, but a nix-built mac binary links against
            # /nix/store dylibs and will not run on a Mac without nix.
            - uses: actions/cache@v4
              id: librealsense
              with:
                  path: ${{ runner.temp }}/librealsense
                  key: librealsense-static-2.57.7-nix-libusb-1.0.30-macos-14-v3
            - if: steps.librealsense.outputs.cache-hit != 'true'
              uses: DeterminateSystems/nix-installer-action@main
            - if: steps.librealsense.outputs.cache-hit != 'true'
              run: |
                  nix build '.#libusb-static^out,dev' --out-link libusb
                  ./.github/static-librealsense-macos.sh 2.57.7 "$RUNNER_TEMP/librealsense" "$PWD/libusb" "$PWD/libusb-dev"
            # librealsense linked in statically, so the binary still needs nothing installed
            - run: cargo build --release --locked --features realsense
              env:
                  PKG_CONFIG_PATH: ${{ runner.temp }}/librealsense/lib/pkgconfig
                  PKG_CONFIG_ALL_STATIC: "1"
            - name: refuse a binary that links anything outside the OS
              run: |
                  otool -L target/release/lite_record
                  ! otool -L target/release/lite_record | tail -n +2 | grep -v -E '^\s*(/usr/lib/|/System/Library/)'
            - run: install -m755 target/release/lite_record lite_record-aarch64-macos
            - uses: actions/upload-artifact@v4
              with:
                  name: macos
                  path: lite_record-aarch64-macos

    release:
        needs: [linux-x86, linux-arm64, macos]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  merge-multiple: true
                  path: dist
            - name: publish the `latest` release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release delete latest --yes --cleanup-tag || true
                  gh release create latest dist/* \
                      --title "latest" \
                      --notes "Built from ${{ github.sha }}"
